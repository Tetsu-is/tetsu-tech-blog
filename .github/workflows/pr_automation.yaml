name: PR Automation

on:
  pull_request:
    types: [opened, reopened]

jobs:
  pr-automation:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set PR title for release
        if: github.base_ref == 'main' && github.head_ref == 'develop'
        run: |
          DATE=$(date +"%Y-%m-%d")
          TITLE="release ${DATE}"
          gh pr edit ${{ github.event.pull_request.number }} --title "${TITLE}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add GitHub Copilot as reviewer
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-reviewer "github-copilot[bot]"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
